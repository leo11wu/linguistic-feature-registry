name: LingMetrics Mac
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build standalone arm64 application
        run: python3 scripts/build_macos.py
      - name: Validate research snapshot
        run: python3 scripts/validate_registry.py
      - name: Test with bundled interpreter
        run: |
          export LINGMETRICS_ROOT="$PWD/dist/LingMetrics.app/Contents/Resources"
          export PYTHONPATH="$LINGMETRICS_ROOT/engine:$LINGMETRICS_ROOT/engine/vendor:$LINGMETRICS_ROOT/base-site"
          export PYTHONNOUSERSITE=1
          export LINGMETRICS_CACHE="$RUNNER_TEMP/lingmetrics-tests"
          "$LINGMETRICS_ROOT/python/bin/python3.11" -m unittest discover -s tests -v
      - name: Verify optional fitting and optimization paths
        run: |
          export LINGMETRICS_ROOT="$PWD/dist/LingMetrics.app/Contents/Resources"
          uv pip install --python "$LINGMETRICS_ROOT/python/bin/python3.11" --target "$RUNNER_TEMP/lingmetrics-optional" torch==2.7.0 rapidfuzz==3.14.3 transformers==4.57.1 numpy==2.4.4 scipy==1.17.1
          export PYTHONPATH="$LINGMETRICS_ROOT/engine:$LINGMETRICS_ROOT/engine/vendor:$LINGMETRICS_ROOT/base-site:$RUNNER_TEMP/lingmetrics-optional"
          export PYTHONNOUSERSITE=1
          export LINGMETRICS_CACHE="$RUNNER_TEMP/lingmetrics-optimization-tests"
          "$LINGMETRICS_ROOT/python/bin/python3.11" -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: LingMetrics-arm64
          path: |
            dist/LingMetrics-0.2.2-arm64.zip
            dist/SHA256SUMS.txt
            dist/build-report.json
          retention-days: 30
